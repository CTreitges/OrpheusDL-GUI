name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: pytest (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # The hires suite is deliberately tkinter-free and depends only on
      # requests, so the test job needs almost nothing installed.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests

      - name: Run test suite
        run: python -m pytest tests/ -v

  gui:
    # Widget tests need tkinter and a display, so they run once on Linux under
    # Xvfb. They caught a real bug the headless suite cannot see: tkinter's
    # after() is silently dropped when called from a worker thread.
    name: GUI widget tests (Xvfb)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tkinter and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests customtkinter

      - name: Run widget tests
        run: xvfb-run -a --server-args="-screen 0 1280x900x24" python -m pytest tests/test_gui_panel.py -v
